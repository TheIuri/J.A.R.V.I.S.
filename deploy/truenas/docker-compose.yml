# JARVIS core para TrueNAS SCALE: Apps -> Discover Apps -> Custom App -> "Install via YAML".
# Antes de pegarlo, cambia TODO lo marcado con <<< (ruta del dataset, token y API keys).
services:
  jarvis-core:
    image: ghcr.io/theiuri/jarvis-core:latest
    container_name: jarvis-core
    restart: unless-stopped
    user: "568:568" # usuario "apps" de TrueNAS; el dataset debe pertenecerle
    ports:
      - "8765:8765"
    volumes:
      - /mnt/TU_POOL/apps/jarvis:/data # <<< dataset para modelos y voces
      # - /mnt/TU_POOL/obsidian:/vault # Obsidian (opcional): dataset de la boveda; ver README
    environment:
      API_TOKEN: "cambia-esto-por-un-token-largo" # <<< genera uno: openssl rand -hex 32
      ASSISTANT_NAME: "Jarvis"
      LANGUAGE: "es"

      # --- Oido (STT) ---
      STT_PROVIDER: "local" # "local" = Whisper en el NAS | "groq" = Whisper en la nube (gratis, mas rapido)
      WHISPER_MODEL: "small" # en CPU: "base" (rapido) o "small" (mejor); con GPU puedes subir a "medium"
      WHISPER_DEVICE: "cpu" # "auto" para usar la GPU si has activado el bloque de GPU de abajo

      # --- Cerebro (LLM): cloud gratuito, en orden de preferencia ---
      LLM_PROVIDERS: "groq" # "groq,gemini" para tener reserva (necesita GEMINI_API_KEY)
      GROQ_API_KEY: "" # <<< https://console.groq.com/keys
      # GEMINI_API_KEY: "" # https://aistudio.google.com/apikey
      # GROQ_MODEL: "openai/gpt-oss-120b" # si Groq lo retira, elige otro en console.groq.com/docs/models
      # GROQ_REASONING_EFFORT: "low" # pon "" si eliges un modelo que no razona
      # GEMINI_MODEL: "gemini-2.5-flash"

      # --- Voz (TTS): Piper local en CPU ---
      TTS_PROVIDER: "piper"
      PIPER_VOICE: "es_ES-davefx-medium"

      # --- Memoria (Nivel 3): SQLite en el dataset (/data/memory.db) ---
      MEMORY_ENABLED: "true" # "false" = sin memoria (no lee ni guarda recuerdos)
      # MEMORY_MAX_ITEMS: "8" # recuerdos que se le pasan al LLM en cada turno

      # --- Obsidian (opcional): descomenta tambien el volumen /vault de arriba ---
      # OBSIDIAN_VAULT: "/vault"
      # OBSIDIAN_INBOX: "Inbox" # carpeta de las notas nuevas
      # OBSIDIAN_DAILY_FOLDER: "Diario" # notas del dia (AAAA-MM-DD.md)
      # OBSIDIAN_MEMORY_NOTE: "true" # JARVIS/Memoria.md con lo que recuerda (solo lectura)

      # --- Herramientas (Nivel 2) ---
      TOOLS_ENABLED: "true" # interruptor general: "false" apaga todas las tools
      # TOOLS_DISABLED: "pc_open_url,pc_timer" # desactivar tools concretas
      TZ: "Europe/Madrid"
      HOME_CITY: "Madrid" # <<< tu ciudad, para el tiempo (mejor con acentos: "Badia del Vallès")
      # Coordenadas de casa (opcional): el tiempo de HOME_CITY no depende del buscador de ciudades.
      # HOME_LATITUDE: "40.4168"
      # HOME_LONGITUDE: "-3.7038"
      # Estado del TrueNAS (opcional). Usuario con rol de solo lectura + API key; ver README.
      # TRUENAS_URL: "wss://IP-DEL-NAS/api/current"
      # TRUENAS_USER: "jarvis"
      # TRUENAS_API_KEY: ""
    deploy:
      resources:
        limits:
          memory: 6G
        # GPU NVIDIA (opcional): descomenta solo si `nvidia-smi` funciona en TrueNAS;
        # si no, el contenedor no arranca.
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

  # --- Acceso desde el movil con HTTPS (opcional) ---------------------------------------
  # Nodo de Tailscale PROPIO de JARVIS: aparece como "jarvis" en tu tailnet y publica
  # https://jarvis.<tu-tailnet>.ts.net -> jarvis-core:8765. Es independiente de cualquier
  # otro Tailscale del NAS (estado propio, modo userspace: no toca la red ni las rutas del host).
  # Para activarlo descomenta este bloque Y el bloque "configs" del final. Ver README.
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: jarvis-tailscale
  #   hostname: jarvis
  #   restart: unless-stopped
  #   environment:
  #     TS_AUTHKEY: "tskey-auth-..." # <<< clave de un solo uso (solo hace falta el primer arranque)
  #     TS_HOSTNAME: "jarvis"
  #     TS_STATE_DIR: "/var/lib/tailscale"
  #     TS_USERSPACE: "true"
  #     TS_SERVE_CONFIG: "/config/serve.json"
  #   volumes:
  #     - /mnt/TU_POOL/apps/jarvis/tailscale:/var/lib/tailscale # <<< misma ruta del dataset + /tailscale
  #   configs:
  #     - source: tailscale-serve
  #       target: /config/serve.json

# configs:
#   tailscale-serve:
#     content: |
#       {"TCP": {"443": {"HTTPS": true}},
#        "Web": {"$${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "http://jarvis-core:8765"}}}}}
