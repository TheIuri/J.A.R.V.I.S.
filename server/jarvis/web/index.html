<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>J.A.R.V.I.S.</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <header>
    <span class="brand">J.A.R.V.I.S.</span>
    <span id="clock" class="mono"></span>
  </header>

  <main>
    <aside id="log" aria-label="Conversación"></aside>

    <section id="stage">
      <canvas id="orb" aria-label="Mantén pulsado para hablar"></canvas>
      <div id="flow" aria-hidden="true"></div>
      <video id="cam" muted playsinline hidden aria-label="Cámara activa"></video>
      <section id="cards" hidden aria-label="Resultados">
        <header><span class="mono" id="cards-title">RESULTADOS</span><button id="cards-close" type="button" aria-label="Cerrar">×</button></header>
        <div id="cards-list"></div>
      </section>
      <p id="trail" class="mono" aria-label="Recorrido del último turno"></p>
      <p id="subtitle" aria-live="polite"></p>
      <p id="you" class="dim"></p>
      <p id="state" class="mono">EN ESPERA</p>
      <p id="hint" class="hint mono">MANTÉN PULSADO EL CEREBRO O LA BARRA ESPACIADORA</p>
      <form id="ask" autocomplete="off">
        <input id="text" placeholder="…o escribe aquí y pulsa Enter" aria-label="Mensaje">
      </form>
    </section>

    <aside id="panel" class="mono">
      <dl>
        <dt>SESIÓN</dt><dd id="s-time">00:00</dd>
        <dt>INTERCAMBIOS</dt><dd id="s-count">0</dd>
        <dt>LATENCIA</dt><dd id="s-latency">—</dd>
        <dt>PICO</dt><dd id="s-peak">—</dd>
        <dt>ETAPAS</dt><dd id="s-stages">—</dd>
        <dt>MODELO</dt><dd id="s-model">—</dd>
        <dt>TOOLS</dt><dd id="s-tools">—</dd>
      </dl>
      <label class="panel-title" for="model">CEREBRO</label>
      <select id="model" aria-label="Modelo"></select>
      <p class="panel-title">CÓRTEX · ESTADO</p>
      <ul id="cortex"></ul>
      <button id="camera" type="button" aria-pressed="false">CÁMARA</button>
      <button id="memories" type="button">MEMORIA</button>
      <button id="reset" type="button">NUEVA CONVERSACIÓN</button>
      <div id="memory-list"></div>
    </aside>
  </main>

  <div id="login" hidden>
    <form id="login-form" autocomplete="off">
      <p class="mono">ACCESO</p>
      <p class="dim">Introduce el token de JARVIS (API_TOKEN). Se guardará solo en este dispositivo.</p>
      <input id="token" type="password" placeholder="Token" aria-label="Token">
      <p id="login-msg" class="error-msg"></p>
      <button type="submit">ENTRAR</button>
    </form>
  </div>

  <script src="hud.js"></script>
</body>
</html>
